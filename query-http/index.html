<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=.8">
    <meta name="color-scheme" content="light" />
    <title>OPC UA EventFilter Query Language</title>
    <link rel="stylesheet" href="pico.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="query.js"></script> 
    <script type="text/javascript">
      function pretty(j) {
          if(j[0] != '{') {
              return j;
          }
          while(j.substring(j.length - 1) != '}') {
              j = j.substring(0, j.length - 1);
          }
              
          try {
            var jsonObj = JSON.parse(j);
            return JSON.stringify(jsonObj, null, '\t');
          } catch(err) {
              return j;
          }
      }

      parse_fun = Module.cwrap('parse', 'string', ['string'])

      window.addEventListener('DOMContentLoaded', function() {
        document.getElementById("submitForm").addEventListener('submit',
          function(e){
            e.preventDefault();
            var out = parse_fun(document.getElementById("query").value);
            document.getElementById("result").value = pretty(out);
        });
      });
    </script>
  </head>
  <body>
    <main class="container">
      <div class="grid">
        <div>
          <h3>Query Input</h3>
          <form id="submitForm">
            <textarea id="query" rows="16" placeholder="Enter query here..."></textarea>
            <input type="submit" value="Parse query">
          </form>
        </div>
        <div>
          <h3>Result</h3>
          <textarea id="result" rows="16" readonly placeholder="Byte-code encoding appears here..."></textarea>
        </div>
      </div>
    </main>
  </body>
</html>

name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        run: |
          wget -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb

      # Hugo >= 0.165 runs PostCSS under node --permission, which Node 20
      # does not support. Node 22+ is required.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No standalone Tailwind step: layouts/_default/baseof.html compiles
      # assets/css/main.css through Hugo's css.PostCSS, which runs Tailwind via
      # postcss.config.js. npm ci above provides postcss-cli + tailwindcss.
      - name: Build Hugo site
        run: hugo --minify --baseURL "https://open62541.org/"
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production

      - name: Deploy to gh-pages-new
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages-new
          force_orphan: false
          keep_files: false
          cname: open62541.org
          commit_message: 'Deploy from ${{ github.sha }}'
